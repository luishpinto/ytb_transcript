[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ytb_transcript"
version = "0.1.0"
description = "Core package for fetching, parsing, and structuring YouTube video transcripts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

authors = [
  { name = "Luis Pinto" }
]

dependencies = [
  "youtube-transcript-api>=0.6.0"
]

[project.urls]
Repository = "https://github.com/luishpinto/ytb_transcript"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*"]
